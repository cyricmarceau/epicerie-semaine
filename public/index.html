<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121417">
<meta name="color-scheme" content="dark">
<title>Épicerie de la semaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
  <svg class="pot splash-pot" viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path class="v" d="M8 8c-1-1.5 1-2.5 0-4"/><path class="v v2" d="M12 8c-1-1.5 1-2.5 0-4"/><path class="v v3" d="M16 8c-1-1.5 1-2.5 0-4"/><g class="corps"><path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="currentColor" fill-opacity=".18"/><path d="M2 12h2M20 12h2"/></g></svg>
  <span class="splash-t">Pu de gossage avec spéciaux</span>
  <span class="splash-v">Version pré-alpha</span>
</div>
<script>setTimeout(function () { var s = document.getElementById("splash"); if (s) s.remove(); }, 1100);</script>
<main class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="titles">
        <p class="kicker"><svg class="pot" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path class="v" d="M8 8c-1-1.5 1-2.5 0-4"/><path class="v v2" d="M12 8c-1-1.5 1-2.5 0-4"/><path class="v v3" d="M16 8c-1-1.5 1-2.5 0-4"/><g class="corps"><path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="currentColor" fill-opacity=".18"/><path d="M2 12h2M20 12h2"/></g></svg><span id="semaine">Chargement…</span></p>
        <h1 id="title" tabindex="-1">Recettes selon les spéciaux</h1>
      </div>
      <canvas id="avatar" class="avatar" width="16" height="16" role="img" aria-label="Avatar 8 bits"></canvas>
    </div>
    <div class="store-tabs" id="store-tabs" role="tablist" aria-label="Épiceries"></div>
  </header>

  <!-- 1. Choix de l'épicerie -->
  <section id="home" aria-labelledby="title">
    <div class="sections" id="store-cards"></div>
  </section>


  <!-- 3. Une recette -->
  <section id="detail" hidden>
    <button type="button" class="back" id="back">← Toutes les recettes</button>
    <article class="card" id="recipe" aria-live="polite"></article>
  </section>

  <!-- Spéciaux -->
  <section id="speciaux" hidden aria-label="Spéciaux de la semaine">
    <div class="sections" id="spec-body"></div>
  </section>

  <!-- Panier -->
  <section id="cart" hidden aria-labelledby="cart-title">
    <h2 id="cart-title">Panier</h2>
    <div id="cart-body" class="sections"></div>
  </section>

  <p class="foot">Prix des circulaires du Québec; ils peuvent varier selon la succursale. Recettes pour 2 portions. Prix à la caisse = formats entiers (barquettes au poids estimées ≈).</p>
</main>
<nav class="tabbar" aria-label="Navigation principale">
  <a href="#" data-tab="recettes"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Recettes</span></a>
  <a href="#speciaux" data-tab="speciaux"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01"/></svg><span>Spéciaux</span></a>
  <a href="#panier" data-tab="panier" id="cart-btn"><span class="ti"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span id="cart-n" hidden>0</span></span><span>Panier</span></a>
</nav>
<script src="app.js"></script>
</body>
</html>
