<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121417">
<meta name="color-scheme" content="dark">
<title>Épicerie de la semaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <p class="kicker" id="semaine">Chargement…</p>
      <h1 id="title" tabindex="-1">Quoi manger cette semaine?</h1>
    </div>
    <a href="#panier" class="cart-btn" id="cart-btn" aria-label="Panier">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span id="cart-n">0</span>
    </a>
  </header>

  <!-- 1. Choix de l'épicerie -->
  <section id="home" aria-labelledby="title">
    <p class="lead">Choisis ton épicerie.</p>
    <div class="store-cards" id="store-cards"></div>
  </section>

  <!-- 2. Recettes d'une épicerie -->
  <section id="store" hidden aria-labelledby="store-title">
    <button type="button" class="back" id="store-back">← Épiceries</button>
    <h2 id="store-title" class="store-h" tabindex="-1"></h2>
    <div class="rec-list" id="recipes"></div>
    <details class="card specials" id="specials">
      <summary id="specials-title">Spéciaux de la semaine</summary>
      <div id="specials-body"></div>
    </details>
  </section>

  <!-- 3. Une recette -->
  <section id="detail" hidden>
    <button type="button" class="back" id="back">← Recettes</button>
    <article class="card" id="recipe" aria-live="polite"></article>
  </section>

  <!-- Panier -->
  <section id="cart" hidden aria-labelledby="cart-title">
    <button type="button" class="back" id="cart-back">← Épiceries</button>
    <h2 id="cart-title">Panier</h2>
    <div id="cart-body" class="sections"></div>
  </section>

  <p class="foot">Prix des circulaires du Québec; ils peuvent varier selon la succursale. Recettes pour 2 portions. Prix à la caisse = formats entiers (barquettes au poids estimées ≈).</p>
</main>
<script src="app.js"></script>
</body>
</html>
